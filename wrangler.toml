name = "united-mobile-rv"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# Workers AI — free open models (Llama). Bind as `AI` in CF Pages → Settings → Functions → Bindings.
[ai]
binding = "AI"

# Forum database (Cloudflare D1). Create with:
#   wrangler d1 create umrt_forum
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "umrt_forum"
database_id = "0f9da84a-c0bd-48cb-a367-75f8aedce93f"

# R2 bucket for forum photo uploads (one image per thread/reply).
# Create with: wrangler r2 bucket create umrt-forum-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "umrt-forum-media"

# Portal accounts DB, bound into a second project (Cloudflare allows one D1
# database to be bound to multiple Pages/Workers projects). Two uses here:
#  1. Read: forum member profiles show a "Verified Customer" badge when the
#     email matches a real portal account.
#  2. Write: /api/book inserts a job record here (the WP /book-service form
#     posts through this function) so umrt-portal's Track page has real
#     data to show.
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "umrt-portal-db"
database_id = "cad7eb04-167f-4330-b7e4-5e35a52de927"
