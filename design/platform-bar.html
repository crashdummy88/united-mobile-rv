<!--
  UMRT cross-platform bar — shared partial, not a full header replacement.
  Drop this ABOVE each property's own <header class="site-header">.
  Pair with platform-bar.css (design/theme.json tokens, no build step needed).

  Usage: set data-platform on the containing element (or the <body>) to one
  of: hub | shop | book | forum | software | docs —
  the matching link gets aria-current.
  This bar intentionally does NOT replace each site's own nav — it's a thin
  strip so a visitor always knows which UMRT property they're on and can
  jump to the others. Lightweight: no JS required for the base bar.

  Product nav lock: Home · Services · Shop · Book · Forum · Software · Docs.
  Call / Text Now stay as convert CTAs. Retired destinations stay off this strip.

  Matt HARD LOCK 2026-09-20: public Book is STRAIGHT to Square
  (https://united-mobile-rv-llc.square.site/). NEVER book.unitedmobilerv.com
  on this strip. Text Now is sms:; call number is tel:.
-->
<div class="umrt-platform-bar" role="navigation" aria-label="UMRT properties">
  <div class="umrt-platform-bar-inner">
    <a href="https://unitedmobilerv.com/" data-platform-link="hub">Home</a>
    <a href="https://unitedmobilerv.com/services/" data-platform-link="service">Services</a>
    <a href="https://shop.unitedmobilerv.com/" data-platform-link="shop">Shop</a>
    <a href="https://united-mobile-rv-llc.square.site/" data-platform-link="book" target="_blank" rel="noopener">Book</a>
    <a href="https://forum.unitedmobilerv.com/" data-platform-link="forum">Forum</a>
    <a href="https://software.unitedmobilerv.com/" data-platform-link="software">Software</a>
    <a href="https://docs.unitedmobilerv.com/" data-platform-link="docs">Docs</a>
    <a href="tel:+16166065277" data-platform-link="call">Call (616) 606-5277</a>
    <a href="sms:+16166065277" data-platform-link="text">Text Now</a>
  </div>
</div>
<script>
  // Marks the current platform's link with aria-current="page" and a
  // .is-current class. Reads data-platform off <html> or <body> — set
  // <html data-platform="hub|shop|book|forum|software|docs"> once per template.
  (function () {
    var root = document.documentElement;
    var current = root.getAttribute('data-platform') || document.body.getAttribute('data-platform');
    if (!current) return;
    var link = document.querySelector('.umrt-platform-bar [data-platform-link="' + current + '"]');
    if (link) { link.setAttribute('aria-current', 'page'); link.classList.add('is-current'); }
  })();
</script>
