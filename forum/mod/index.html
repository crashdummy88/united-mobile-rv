<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Queue | United Mobile RV</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site-header">
  <div class="wrap nav-bar">
    <a class="brand" href="/"><img class="brand-logo" src="/assets/brand/umrt-logo.webp" alt="United Mobile RV" width="40" height="40"><span class="brand-text">United Mobile <span>RV</span></span></a>
    <ul class="nav-links"><li><a href="/forum/">Back to Forum</a></li></ul>
  </div>
</header>
<main id="main">
<section class="page-hero">
  <div class="wrap">
    <h1>Moderation Queue</h1>
    <p class="lead">Posts the AI classifier auto-held for review. Approve to publish, remove to keep hidden.</p>
  </div>
</section>
<section class="band">
  <div class="wrap wrap-narrow">
    <h2>AI-flagged content</h2>
    <div id="queue"><p class="muted">Loading&hellip;</p></div>
    <h2 style="margin-top:32px">Member reports</h2>
    <div id="reports"><p class="muted">Loading&hellip;</p></div>
  </div>
</section>
</main>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function load() {
  const el = document.getElementById('queue');
  const res = await fetch('/api/mod/queue');
  const data = await res.json();
  if (!data.success) {
    el.innerHTML = '<p class="muted">' + (data.error === 'forbidden' ? 'You are not a moderator, or you are not signed in.' : 'Queue unavailable.') + '</p>';
    return;
  }
  if (!data.items.length) {
    el.innerHTML = '<p class="muted">Nothing waiting for review.</p>';
    return;
  }
  el.innerHTML = data.items.map(function(item){
    return '<div class="faq-item" data-kind="'+item.kind+'" data-id="'+item.id+'" data-author-id="'+esc(item.author_id||'')+'">' +
      '<p class="mb-0"><strong>' + esc(item.kind) + '</strong> by ' + esc(item.author) + ' &mdash; ' + esc(item.created_at) + '</p>' +
      '<p class="muted" style="font-size:13px">Flag reason: ' + esc(item.ai_reason || 'n/a') + '</p>' +
      '<p>' + esc(item.preview).slice(0,400) + '</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-gold" data-action="approve">Approve</button>' +
        '<button class="btn btn-ghost" data-action="remove">Keep Removed</button>' +
        (item.author_id ? '<button class="btn btn-ghost" data-ban-user="'+esc(item.author_id)+'" style="color:#e05a5a">Ban ' + esc(item.author) + '</button>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  el.querySelectorAll('button[data-action]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const card = btn.closest('[data-id]');
      await fetch('/api/mod/queue', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ kind: card.dataset.kind, id: card.dataset.id, action: btn.dataset.action })
      });
      card.remove();
    });
  });

  el.querySelectorAll('button[data-ban-user]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      if (!confirm('Ban this member? They will be signed out of the forum immediately and unable to post or sign in again.')) return;
      btn.disabled = true;
      const res = await fetch('/api/mod/queue', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ kind: 'user', id: btn.dataset.banUser, action: 'ban' })
      });
      const d = await res.json().catch(function(){return {};});
      btn.textContent = d.success ? 'Banned' : (d.error === 'cannot_ban_moderator' ? 'Cannot ban a moderator' : 'Could not ban');
    });
  });
}
function loadReports() {
  return fetch('/api/mod/queue').then(function(r){ return r.json(); }).then(function(data){
    var el = document.getElementById('reports');
    if (!data.success) { el.innerHTML = ''; return; }
    if (!data.reports || !data.reports.length) { el.innerHTML = '<p class="muted">No open reports.</p>'; return; }
    el.innerHTML = data.reports.map(function(r){
      return '<div class="faq-item" data-report-id="'+r.id+'" data-thread-id="'+esc(r.thread_id||'')+'" data-thread-author-id="'+esc(r.thread_author_id||'')+'">' +
        '<p class="mb-0"><strong>Reported: ' + esc(r.reason) + '</strong> by ' + esc(r.reporter) + ' &mdash; ' + esc(r.created_at) + '</p>' +
        (r.thread_title ? '<p class="muted" style="font-size:13px"><a class="text-link" href="/forum/t/'+esc(r.thread_id)+'" target="_blank">' + esc(r.thread_title) + '</a> (by ' + esc(r.thread_author_name||'unknown') + ')</p>' : '') +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" data-report-action="dismiss">Dismiss</button>' +
          (r.thread_id ? '<button class="btn btn-ghost" data-report-action="lock">Lock thread</button>' : '') +
          (r.thread_author_id ? '<button class="btn btn-ghost" data-ban-user="'+esc(r.thread_author_id)+'" style="color:#e05a5a">Ban thread author</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    el.querySelectorAll('[data-report-action]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var card = btn.closest('[data-report-id]');
        var reportId = card.dataset.reportId;
        if (btn.dataset.reportAction === 'dismiss') {
          await fetch('/api/mod/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind:'report', id: reportId, action:'dismiss_report' }) });
          card.remove();
        } else if (btn.dataset.reportAction === 'lock') {
          var threadId = card.dataset.threadId;
          if (threadId) await fetch('/api/mod/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind:'thread', id: threadId, action:'lock' }) });
          await fetch('/api/mod/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind:'report', id: reportId, action:'dismiss_report' }) });
          card.remove();
        }
      });
    });
    el.querySelectorAll('[data-ban-user]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        if (!confirm('Ban this member? They will be signed out of the forum immediately and unable to post or sign in again.')) return;
        btn.disabled = true;
        const res = await fetch('/api/mod/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind:'user', id: btn.dataset.banUser, action:'ban' }) });
        const d = await res.json().catch(function(){return {};});
        btn.textContent = d.success ? 'Banned' : (d.error === 'cannot_ban_moderator' ? 'Cannot ban a moderator' : 'Could not ban');
      });
    });
  });
}

load();
loadReports();
</script>
</body>
</html>
